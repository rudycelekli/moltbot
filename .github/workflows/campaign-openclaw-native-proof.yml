name: Campaign OpenClaw native proof

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Reviewed full commit SHA in this fork
        required: true
        type: string
      lane:
        description: Reviewed native proof lane
        required: true
        default: grapheme
        type: choice
        options:
          - grapheme
          - grapheme-checks
          - images-baseline
          - images

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "true"
      PROOF_LANE: ${{ inputs.lane }}
      EXPECTED_HEAD: ${{ inputs.candidate }}
      PROOF_BASE: 8242407539b5d783b8fb8793f54d7092b4bbbd5a
    steps:
      - name: Validate immutable target
        run: |
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          case "$PROOF_LANE" in grapheme|grapheme-checks|images-baseline|images) ;; *) exit 2 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rudycelekli/moltbot
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PROOF_BASE" HEAD
          test "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager.split("+")[0]')" = "pnpm@12.5.1"
          mkdir -p "$RUNNER_TEMP/native-proof"
          printf 'candidate=%s\nbaseline=%s\n' "$EXPECTED_HEAD" "$PROOF_BASE" > "$RUNNER_TEMP/native-proof/identity.txt"
      - name: Install repository check prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          rg --version
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"
          semantic-checks: "true"
          cache-mode: "off"
      - name: Require original defect through repository runner
        if: inputs.lane != 'grapheme-checks'
        run: |
          set -euo pipefail
          case "$PROOF_LANE" in
            grapheme)
              production=(src/agents/embedded-agent-block-chunker.ts)
              tests=(src/agents/embedded-agent-block-chunker.test.ts src/agents/embedded-agent-subscribe.subscribe-embedded-agent-session.subscribeembeddedagentsession.test.ts)
              ;;
            images-baseline|images)
              production=(src/agents/tool-images.ts src/agents/agent-tools.read.ts src/agents/embedded-agent-runner/run/images.ts)
              tests=(src/agents/embedded-agent-runner/run/images.test.ts src/agents/agent-tools.read.images.test.ts)
              ;;
          esac
          mkdir -p "$RUNNER_TEMP/native-proof/production"
          restore_production() {
            for file in "${production[@]}"; do
              cp "$RUNNER_TEMP/native-proof/production/$file" "$file"
            done
          }
          for file in "${production[@]}"; do
            mkdir -p "$RUNNER_TEMP/native-proof/production/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/native-proof/production/$file"
          done
          trap restore_production EXIT
          for file in "${production[@]}"; do
            git show "$PROOF_BASE:$file" > "$file"
          done
          set +e
          /usr/bin/time -p pnpm test "${tests[@]}" --maxWorkers=1 > "$RUNNER_TEMP/native-proof/baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/native-proof/baseline.log"
          printf 'exit_code=%s\n' "$result" > "$RUNNER_TEMP/native-proof/baseline-result.txt"
          test "$result" = 1
          case "$PROOF_LANE" in
            grapheme)
              grep -F 'keeps a fitting family emoji intact at the normal streaming cap' "$RUNNER_TEMP/native-proof/baseline.log"
              grep -F 'delivers intact graphemes from' "$RUNNER_TEMP/native-proof/baseline.log"
              ;;
            images-baseline|images)
              grep -F 'reads a PNG snapshot (partially written: true)' "$RUNNER_TEMP/native-proof/baseline.log"
              grep -F 'omits a partially written PNG while retaining a complete prompt image' "$RUNNER_TEMP/native-proof/baseline.log"
              ;;
          esac
          grep -E 'AssertionError|expected .* to' "$RUNNER_TEMP/native-proof/baseline.log"
      - name: Candidate native regression and sibling controls
        if: inputs.lane != 'images-baseline' && inputs.lane != 'grapheme-checks'
        run: |
          set -euo pipefail
          git diff --exit-code
          case "$PROOF_LANE" in
            grapheme)
              tests=(src/agents/embedded-agent-block-chunker.test.ts src/agents/embedded-agent-subscribe.subscribe-embedded-agent-session.subscribeembeddedagentsession.test.ts)
              ;;
            images)
              tests=(src/agents/embedded-agent-runner/run/images.test.ts src/agents/agent-tools.read.images.test.ts src/agents/tool-images.test.ts src/agents/tool-images.backend-unavailable.test.ts src/agents/tool-images.input-cap.test.ts src/agents/tool-images.log.test.ts)
              ;;
          esac
          /usr/bin/time -p pnpm test "${tests[@]}" --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/native-proof/candidate.log"
      - name: Required changed checks
        if: inputs.lane != 'images-baseline'
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm check:changed --base "$PROOF_BASE" 2>&1 | tee "$RUNNER_TEMP/native-proof/changed-checks.log"
      - name: Build changed import boundary
        if: inputs.lane != 'images-baseline'
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm build 2>&1 | tee "$RUNNER_TEMP/native-proof/build.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openclaw-native-proof-${{ inputs.candidate }}
          path: ${{ runner.temp }}/native-proof/
          if-no-files-found: warn
          retention-days: 14
