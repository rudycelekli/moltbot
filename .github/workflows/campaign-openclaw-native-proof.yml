name: Campaign OpenClaw native proof

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Reviewed full commit SHA in this fork
        required: true
        type: string

permissions:
  contents: read

jobs:
  grapheme-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "true"
      EXPECTED_HEAD: ${{ inputs.candidate }}
      PROOF_BASE: 8242407539b5d783b8fb8793f54d7092b4bbbd5a
    steps:
      - name: Validate immutable target
        run: |
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rudycelekli/moltbot
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PROOF_BASE" HEAD
          test "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager.split("+")[0]')" = "pnpm@12.5.1"
          mkdir -p "$RUNNER_TEMP/native-proof"
          printf 'candidate=%s\nbaseline=%s\n' "$EXPECTED_HEAD" "$PROOF_BASE" > "$RUNNER_TEMP/native-proof/identity.txt"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"
          semantic-checks: "true"
          cache-mode: "off"
      - name: Require original defect through repository runner
        run: |
          set -euo pipefail
          production=src/agents/embedded-agent-block-chunker.ts
          saved="$RUNNER_TEMP/native-proof/candidate-production.ts"
          cp "$production" "$saved"
          trap 'cp "$saved" "$production"' EXIT
          git show "$PROOF_BASE:$production" > "$production"
          set +e
          /usr/bin/time -p pnpm test src/agents/embedded-agent-block-chunker.test.ts src/agents/embedded-agent-subscribe.subscribe-embedded-agent-session.subscribeembeddedagentsession.test.ts --maxWorkers=1 > "$RUNNER_TEMP/native-proof/baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/native-proof/baseline.log"
          printf 'exit_code=%s\n' "$result" > "$RUNNER_TEMP/native-proof/baseline-result.txt"
          test "$result" = 1
          grep -F 'keeps a fitting family emoji intact at the normal streaming cap' "$RUNNER_TEMP/native-proof/baseline.log"
          grep -F 'delivers intact graphemes from' "$RUNNER_TEMP/native-proof/baseline.log"
          grep -E 'AssertionError|expected .* to' "$RUNNER_TEMP/native-proof/baseline.log"
      - name: Candidate native regression and sibling controls
        run: |
          set -euo pipefail
          git diff --exit-code
          /usr/bin/time -p pnpm test src/agents/embedded-agent-block-chunker.test.ts src/agents/embedded-agent-subscribe.subscribe-embedded-agent-session.subscribeembeddedagentsession.test.ts --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/native-proof/candidate.log"
      - name: Required changed checks
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm check:changed --base "$PROOF_BASE" 2>&1 | tee "$RUNNER_TEMP/native-proof/changed-checks.log"
      - name: Build changed import boundary
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm build 2>&1 | tee "$RUNNER_TEMP/native-proof/build.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openclaw-native-proof-${{ inputs.candidate }}
          path: ${{ runner.temp }}/native-proof/
          if-no-files-found: warn
          retention-days: 14
