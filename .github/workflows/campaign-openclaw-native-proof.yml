name: Campaign OpenClaw native proof

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Reviewed full commit SHA in this fork
        required: true
        type: string
      lane:
        description: Reviewed native proof lane
        required: true
        default: grapheme
        type: choice
        options:
          - grapheme
          - grapheme-checks
          - images-baseline
          - images
          - feishu-baseline
          - feishu
          - feishu-streaming-baseline
          - feishu-streaming
          - acp-model-baseline
          - acp-model
          - preview-links-baseline
          - preview-links
          - preview-links-checks

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "true"
      PROOF_LANE: ${{ inputs.lane }}
      EXPECTED_HEAD: ${{ inputs.candidate }}
      PROOF_BASE: ${{ (startsWith(inputs.lane, 'acp-model') || startsWith(inputs.lane, 'preview-links')) && '96ccec4a1385f1554579d60dc058fb82419dbc79' || '8242407539b5d783b8fb8793f54d7092b4bbbd5a' }}
    steps:
      - name: Validate immutable target
        run: |
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          case "$PROOF_LANE" in grapheme|grapheme-checks|images-baseline|images|feishu-baseline|feishu|feishu-streaming-baseline|feishu-streaming|acp-model-baseline|acp-model|preview-links-baseline|preview-links|preview-links-checks) ;; *) exit 2 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rudycelekli/moltbot
          ref: ${{ inputs.candidate }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$PROOF_BASE" HEAD
          test "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).packageManager.split("+")[0]')" = "pnpm@12.5.1"
          mkdir -p "$RUNNER_TEMP/native-proof"
          printf 'candidate=%s\nbaseline=%s\n' "$EXPECTED_HEAD" "$PROOF_BASE" > "$RUNNER_TEMP/native-proof/identity.txt"
      - name: Install repository check prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          rg --version
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.x"
          install-bun: "false"
          install-deps: "true"
          frozen-lockfile: "true"
          semantic-checks: "true"
          cache-mode: "off"
      - name: Require original defect through repository runner
        if: inputs.lane != 'grapheme-checks' && inputs.lane != 'preview-links-checks'
        run: |
          set -euo pipefail
          case "$PROOF_LANE" in
            grapheme)
              production=(src/agents/embedded-agent-block-chunker.ts)
              tests=(src/agents/embedded-agent-block-chunker.test.ts src/agents/embedded-agent-subscribe.subscribe-embedded-agent-session.subscribeembeddedagentsession.test.ts)
              ;;
            images-baseline|images)
              production=(src/agents/tool-images.ts src/agents/agent-tools.read.ts src/agents/embedded-agent-runner/run/images.ts)
              tests=(src/agents/embedded-agent-runner/run/images.test.ts src/agents/agent-tools.read.images.test.ts)
              ;;
            feishu-baseline|feishu)
              production=(extensions/feishu/src/tool-result.ts)
              tests=(extensions/feishu/src/docx-error-loopback.test.ts)
              ;;
            feishu-streaming-baseline|feishu-streaming)
              production=(extensions/feishu/src/reply-dispatcher.ts)
              tests=(extensions/feishu/src/reply-dispatcher.streaming-backlog.test.ts)
              ;;
            acp-model-baseline|acp-model)
              production=(src/cli/config-model-validation.ts)
              tests=(src/cli/config-cli.acp-model.process.test.ts)
              ;;
            preview-links-baseline|preview-links)
              production=(packages/normalization-core/src/markdown-plain-text.ts)
              tests=(packages/normalization-core/src/markdown-plain-text.test.ts src/gateway/session-display-projection.test.ts)
              ;;
          esac
          mkdir -p "$RUNNER_TEMP/native-proof/production"
          restore_production() {
            for file in "${production[@]}"; do
              cp "$RUNNER_TEMP/native-proof/production/$file" "$file"
            done
          }
          for file in "${production[@]}"; do
            mkdir -p "$RUNNER_TEMP/native-proof/production/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/native-proof/production/$file"
          done
          trap restore_production EXIT
          for file in "${production[@]}"; do
            git show "$PROOF_BASE:$file" > "$file"
          done
          if [[ "$PROOF_LANE" = acp-model || "$PROOF_LANE" = acp-model-baseline ]]; then
            # The packaged CLI reads dist. Build after restoring original source
            # so the before test cannot accidentally use candidate artifacts.
            /usr/bin/time -p pnpm build 2>&1 | tee "$RUNNER_TEMP/native-proof/baseline-build.log"
          fi
          set +e
          if [[ "$PROOF_LANE" = feishu || "$PROOF_LANE" = feishu-baseline || "$PROOF_LANE" = feishu-streaming || "$PROOF_LANE" = feishu-streaming-baseline ]]; then
            /usr/bin/time -p node scripts/run-vitest.mjs "${tests[@]}" --maxWorkers=1 > "$RUNNER_TEMP/native-proof/baseline.log" 2>&1
            result=$?
          elif [[ "$PROOF_LANE" = images || "$PROOF_LANE" = images-baseline ]]; then
            : > "$RUNNER_TEMP/native-proof/baseline.log"
            result=1
            for test_file in "${tests[@]}"; do
              /usr/bin/time -p pnpm test "$test_file" --maxWorkers=1 >> "$RUNNER_TEMP/native-proof/baseline.log" 2>&1
              suite_result=$?
              printf 'suite=%s exit_code=%s\n' "$test_file" "$suite_result" >> "$RUNNER_TEMP/native-proof/baseline.log"
              # The dispatcher stops on an early failed shard. Run each suite
              # independently so both real defects must be observed.
              if [[ "$suite_result" != 1 ]]; then result=2; fi
            done
          elif [[ "$PROOF_LANE" = preview-links || "$PROOF_LANE" = preview-links-baseline ]]; then
            # A failing project stops the dispatcher. Independently execute the
            # unchanged helper controls and the intended Gateway regression.
            : > "$RUNNER_TEMP/native-proof/baseline.log"
            result=1
            for test_file in "${tests[@]}"; do
              /usr/bin/time -p pnpm test "$test_file" --maxWorkers=1 >> "$RUNNER_TEMP/native-proof/baseline.log" 2>&1
              suite_result=$?
              printf 'suite=%s exit_code=%s\n' "$test_file" "$suite_result" >> "$RUNNER_TEMP/native-proof/baseline.log"
              expected=0
              if [[ "$test_file" = src/gateway/session-display-projection.test.ts ]]; then expected=1; fi
              if [[ "$suite_result" != "$expected" ]]; then result=2; fi
            done
          else
            /usr/bin/time -p pnpm test "${tests[@]}" --maxWorkers=1 > "$RUNNER_TEMP/native-proof/baseline.log" 2>&1
            result=$?
          fi
          set -e
          cat "$RUNNER_TEMP/native-proof/baseline.log"
          printf 'exit_code=%s\n' "$result" > "$RUNNER_TEMP/native-proof/baseline-result.txt"
          test "$result" = 1
          case "$PROOF_LANE" in
            grapheme)
              grep -F 'keeps a fitting family emoji intact at the normal streaming cap' "$RUNNER_TEMP/native-proof/baseline.log"
              grep -F 'delivers intact graphemes from' "$RUNNER_TEMP/native-proof/baseline.log"
              ;;
            images-baseline|images)
              grep -F 'reads a PNG snapshot (partially written: true)' "$RUNNER_TEMP/native-proof/baseline.log"
              grep -F 'omits a partially written PNG while retaining a complete prompt image' "$RUNNER_TEMP/native-proof/baseline.log"
              ;;
            feishu-baseline|feishu)
              grep -F 'retains conversion rejection code, message and request log identity' "$RUNNER_TEMP/native-proof/baseline.log"
              ;;
            feishu-streaming-baseline|feishu-streaming)
              grep -F 'obsolete previews' "$RUNNER_TEMP/native-proof/baseline.log"
              ;;
            acp-model-baseline|acp-model)
              grep -F 'accepts an ACP bare object primary without native provider registration' "$RUNNER_TEMP/native-proof/baseline.log"
              grep -F 'accepts an ACP qualified object primary' "$RUNNER_TEMP/native-proof/baseline.log"
              grep -F 'accepts an ACP string primary without native provider registration' "$RUNNER_TEMP/native-proof/baseline.log"
              grep -F 'writes the authored ACP primary while preserving the native defaults' "$RUNNER_TEMP/native-proof/baseline.log"
              # Config dry-run intentionally redacts dependency diagnostics.
              grep -F 'Unable to resolve authored model reference' "$RUNNER_TEMP/native-proof/baseline.log"
              ;;
            preview-links-baseline|preview-links)
              grep -F 'flattens Markdown nested link label before bounding a preview' "$RUNNER_TEMP/native-proof/baseline.log"
              grep -F 'flattens Markdown balanced link destination before bounding a preview' "$RUNNER_TEMP/native-proof/baseline.log"
              grep -F 'flattens Markdown escaped link destination before bounding a preview' "$RUNNER_TEMP/native-proof/baseline.log"
              ;;
          esac
          grep -E 'AssertionError|expected .* to' "$RUNNER_TEMP/native-proof/baseline.log"
      - name: Candidate native regression and sibling controls
        if: inputs.lane != 'images-baseline' && inputs.lane != 'feishu-baseline' && inputs.lane != 'feishu-streaming-baseline' && inputs.lane != 'grapheme-checks' && inputs.lane != 'acp-model-baseline' && inputs.lane != 'preview-links-baseline'
        run: |
          set -euo pipefail
          git diff --exit-code
          case "$PROOF_LANE" in
            grapheme)
              tests=(src/agents/embedded-agent-block-chunker.test.ts src/agents/embedded-agent-subscribe.subscribe-embedded-agent-session.subscribeembeddedagentsession.test.ts)
              ;;
            images)
              tests=(src/agents/embedded-agent-runner/run/images.test.ts src/agents/agent-tools.read.images.test.ts src/agents/tool-images.test.ts src/agents/tool-images.backend-unavailable.test.ts src/agents/tool-images.input-cap.test.ts src/agents/tool-images.log.test.ts)
              ;;
            feishu)
              tests=(extensions/feishu/src/docx-error-loopback.test.ts)
              ;;
            feishu-streaming)
              tests=(extensions/feishu/src/reply-dispatcher.streaming-backlog.test.ts)
              ;;
            acp-model)
              tests=(src/cli/config-cli.acp-model.process.test.ts src/cli/config-cli.test.ts src/cli/config-model-validation.test.ts src/agents/agent-scope.test.ts)
              # Rebuild the restored candidate source before invoking its CLI.
              /usr/bin/time -p pnpm build 2>&1 | tee "$RUNNER_TEMP/native-proof/build.log"
              ;;
            preview-links)
              tests=(packages/normalization-core/src/markdown-plain-text.test.ts src/gateway/session-display-projection.test.ts)
              ;;
            preview-links-checks)
              # Before proof at 8bbc18b5 exercised unchanged fixtures on the
              # original owner. After its complete relocation, reuse that proof.
              tests=(packages/markdown-core/src/markdown-plain-text.test.ts src/gateway/session-display-projection.test.ts)
              ;;
          esac
          if [[ "$PROOF_LANE" = feishu || "$PROOF_LANE" = feishu-streaming ]]; then
            /usr/bin/time -p pnpm test:extension feishu 2>&1 | tee "$RUNNER_TEMP/native-proof/candidate.log"
          else
            /usr/bin/time -p pnpm test "${tests[@]}" --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/native-proof/candidate.log"
          fi
      - name: Retain native tests before long checks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openclaw-native-tests-${{ inputs.candidate }}
          path: |
            ${{ runner.temp }}/native-proof/identity.txt
            ${{ runner.temp }}/native-proof/baseline.log
            ${{ runner.temp }}/native-proof/baseline-build.log
            ${{ runner.temp }}/native-proof/build.log
            ${{ runner.temp }}/native-proof/baseline-result.txt
            ${{ runner.temp }}/native-proof/candidate.log
          if-no-files-found: warn
          retention-days: 14
      - name: Required changed checks
        if: inputs.lane != 'images-baseline' && inputs.lane != 'feishu-baseline' && inputs.lane != 'feishu-streaming-baseline' && inputs.lane != 'acp-model-baseline' && inputs.lane != 'preview-links-baseline'
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm check:changed --base "$PROOF_BASE" 2>&1 | tee "$RUNNER_TEMP/native-proof/changed-checks.log"
      - name: Build changed import boundary
        if: inputs.lane != 'images-baseline' && inputs.lane != 'feishu-baseline' && inputs.lane != 'feishu-streaming-baseline' && inputs.lane != 'acp-model-baseline' && inputs.lane != 'acp-model' && inputs.lane != 'preview-links-baseline'
        run: |
          set -euo pipefail
          /usr/bin/time -p pnpm build 2>&1 | tee "$RUNNER_TEMP/native-proof/build.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: openclaw-native-proof-${{ inputs.candidate }}
          path: ${{ runner.temp }}/native-proof/
          if-no-files-found: warn
          retention-days: 14
